<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recovery Assistant Pro</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div class="bg"></div>
<div class="container">
  <header class="hero card">
    <div>
      <h1>Recovery Assistant Pro</h1>
      <p>默认只读扫描 · 高风险操作必须二次确认 · 全流程日志追踪</p>
    </div>
    <div class="theme-switcher">
      <button class="chip active" data-theme="c" onclick="setTheme('c', this)">C</button>
      <button class="chip" data-theme="cpp" onclick="setTheme('cpp', this)">C++</button>
      <button class="chip" data-theme="rust" onclick="setTheme('rust', this)">Rust</button>
      <button class="chip" data-theme="csharp" onclick="setTheme('csharp', this)">C#</button>
    </div>
  </header>

  <section class="grid">
    <div class="card">
      <h3>① 选择磁盘或分区</h3>
      <label>源设备 / 镜像文件</label>
      <input id="source" placeholder="例如 /dev/sdb1 或 /data/disk.dd" />
      <div class="inline">
        <button onclick="startScan()">开始扫描</button>
        <span id="safeBadge" class="badge">Read-Only</span>
      </div>
    </div>

    <div class="card">
      <h3>② 扫描进度</h3>
      <div class="progress"><div id="bar"></div></div>
      <p id="status">等待任务</p>
    </div>

    <div class="card wide">
      <h3>③ 可恢复文件预览</h3>
      <label>文件类型筛选（逗号分隔）</label>
      <input id="filter" placeholder="jpg,pdf,docx" oninput="applyFilter()" />
      <ul id="fileList"></ul>
    </div>

    <div class="card wide">
      <h3>④ 恢复输出与风控</h3>
      <label>恢复目录</label>
      <input id="outputDir" placeholder="例如 /tmp/recovered" />
      <label class="check">
        <input type="checkbox" id="confirmRisk" />
        我已知晓：覆盖写入、分区写回、引导区修复属于高风险操作
      </label>
      <button onclick="recover()">执行恢复</button>
      <pre id="log"></pre>
    </div>
  </section>
</div>
<script src="/static/app.js"></script>
</body>
</html>
